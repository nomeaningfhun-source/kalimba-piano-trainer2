<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kalimba 13 Keys & Piano Trainer</title>
  <style>
    :root {
      --navy: #07336B;
      --navy-light: #617184;
      --bg: #0F172A;
      --gold: #E8A33D;
      --surface: #1E293B;
      --text: #F8FAFC;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Prompt", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 600px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--gold);
    }

    .controls-top {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--navy);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Waterfall Canvas Container */
    #waterfall-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: #111827;
      border-bottom: 2px solid var(--gold);
      overflow: hidden;
    }

    #waterfallCanvas {
      display: block;
      width: 100%;
      height: 280px;
    }

    /* Kalimba 13 Keys Container */
    #kalimba-container {
      width: 100%;
      max-width: 600px;
      height: 260px;
      background: #1e293b;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 4px;
      touch-action: none;
    }

    .tine {
      flex: 1;
      margin: 0 2px;
      background: linear-gradient(180deg, #94a3b8 0%, #cbd5e1 70%, #f1f5f9 100%);
      border-radius: 0 0 12px 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.05s ease, background 0.05s ease;
    }

    .tine.active {
      background: linear-gradient(180deg, var(--gold) 0%, #fde047 100%);
      transform: translateY(6px);
    }

    .tine-label {
      color: #0f172a;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.1;
      text-align: center;
    }

    .tine-shape {
      font-size: 11px;
      margin-top: 4px;
    }

    /* Status Bar & Controls */
    .dashboard {
      width: 100%;
      max-width: 600px;
      padding: 10px 16px;
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    /* Latency Calibration Overlay */
    #calibration-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
